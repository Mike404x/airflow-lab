<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airflow Lab · PC case airflow simulator</title>
  <meta name="description" content="Design PC case airflow: pick a case, motherboard, CPU, cooler, GPU and fans, then see pressure, airflow, CFD heat maps and component temperatures in 2D and 3D.">
  <meta name="theme-color" content="#07090d">
  <meta property="og:title" content="Airflow Lab · PC case airflow simulator">
  <meta property="og:description" content="Build a PC and check its airflow, pressure and temperatures with a live CFD simulation.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mview="sim">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2"/><path d="M12 9.8c0-3.4 1.2-6.3 3.6-6.3 2.6 0 2.4 4.1-.4 6.9M14.2 12c3.4 0 6.3 1.2 6.3 3.6 0 2.6-4.1 2.4-6.9-.4M12 14.2c0 3.4-1.2 6.3-3.6 6.3-2.6 0-2.4-4.1.4-6.9M9.8 12c-3.4 0-6.3-1.2-6.3-3.6 0-2.6 4.1-2.4 6.9.4"/></svg>
        </div>
        <div>
          <div class="brand-name">Airflow Lab</div>
          <div class="brand-sub">PC airflow &amp; thermal simulator</div>
        </div>
      </div>
      <div class="template-picker">
        <span class="template-label">Template</span>
        <select id="presetSelect" title="Example builds"></select>
        <button id="btnLoadPreset" class="btn primary sm">Load</button>
      </div>
      <div class="topbar-actions">
        <button id="btnExport" class="icon-btn" title="Export build as JSON" data-icon="download"></button>
        <label class="icon-btn" title="Import build from JSON" data-icon="upload"><input type="file" id="fileImport" accept="application/json,.json" hidden></label>
        <button id="btnReset" class="icon-btn" title="Reset to default build" data-icon="reset"></button>
      </div>
    </header>

    <main class="layout">
      <nav class="rail" id="rail"></nav>
      <aside class="sidebar" id="configPanel"></aside>

      <section class="stage">
        <div class="kpis" id="kpis"></div>
        <div class="viewport">
          <canvas id="caseCanvas"></canvas>
          <div class="float top-left">
            <div class="segmented glass icon-seg">
              <button class="seg icon active" data-view="temperature" data-tip="Temperature" data-icon="thermo"></button>
              <button class="seg icon" data-view="speed" data-tip="Air speed" data-icon="wind"></button>
              <button class="seg icon" data-view="none" data-tip="Streamlines only" data-icon="waves"></button>
            </div>
            <div class="segmented glass icon-seg">
              <button class="seg icon active" id="chkParticles" data-tip="Particles" data-icon="sparkle"></button>
              <button class="seg icon" id="btnAddFan" data-tip="Add fan" data-icon="plus"></button>
            </div>
            <div class="segmented glass mode-switch">
              <button class="seg active" id="btn2d" data-tip="2D side view">2D</button>
              <button class="seg" id="btn3d" data-tip="3D view">3D</button>
            </div>
            <div class="popover-wrap">
              <button class="icon-btn glass layers-btn" id="btnLayers" data-tip="3D render options" data-icon="layers"></button>
              <div class="popover glass" id="layersPopover"></div>
            </div>
          </div>
          <div class="float top-right">
            <div class="glass sim-controls">
              <select id="speedSelect" title="Simulation speed">
                <option value="1">Real time</option>
                <option value="4">4×</option>
                <option value="max" selected>Max speed</option>
              </select>
              <button id="btnPlay" class="btn primary start-btn" data-tip="Start the airflow simulation"></button>
              <button id="btnRestart" class="icon-btn ghost" data-tip="Restart CFD" data-icon="restart"></button>
            </div>
          </div>
          <div class="float bottom-left"><div id="legend" class="legend glass"></div></div>
          <div class="float bottom-right"><div id="simStatus" class="sim-status glass"></div></div>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </section>

      <aside class="inspector">
        <div class="tabs" id="rightTabs">
          <button class="tab active" data-tab="inspect"><span data-icon="target"></span>Inspector</button>
          <button class="tab" data-tab="results"><span data-icon="chart"></span>Results</button>
          <button class="tab" data-tab="insights"><span data-icon="bulb"></span>Insights<span class="tab-badge" id="insightsBadge"></span></button>
        </div>
        <div class="tab-body active" data-panel="inspect"><div id="editor" class="editor"></div></div>
        <div class="tab-body" data-panel="results"><div id="results"></div></div>
        <div class="tab-body" data-panel="insights"><div id="insights"></div></div>
      </aside>
    </main>

    <nav class="mobile-nav" id="mobileNav">
      <button class="mnav" data-mview="build"><span data-icon="sliders"></span>Build</button>
      <button class="mnav active" data-mview="sim"><span data-icon="fan"></span>Simulate</button>
      <button class="mnav" data-mview="details"><span data-icon="chart"></span>Details<span class="tab-badge" id="mobileBadge"></span></button>
    </nav>
  </div>
  <script src="js/data.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/catalog-more.js"></script>
  <script src="js/catalog-2015.js"></script>
  <script src="js/catalog-gpus.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/cfd.js"></script>
  <script src="vendor/three/three.min.js"></script>
  <script src="vendor/three/OrbitControls.js"></script>
  <script src="js/render.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
